# These settings are synced to GitHub by https://probot.github.io/apps/settings/
# on a push to the default branch that touches this file.

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: kamerplanter-infrastructure
  description: Terraform modules and scripts that deploy the Kamerplanter appliance on Proxmox VE and hosting providers
  homepage: https://nolte.github.io/kamerplanter-infrastructure
  # A COMMA-SEPARATED STRING, not a YAML list: probot/settings calls
  # `topics.split()`, and a list throws after the repository PATCH, which
  # silently withholds the whole `branches:` block below.
  topics: kamerplanter, terraform, proxmox, appliance, self-hosted, infrastructure-as-code
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

# Context names are the job-level `name:` values from .github/workflows/ci.yml.
# `restrictions: null` is load-bearing on a personal account: GitHub rejects
# push restrictions there, and the Settings App then drops the entire update.
branches:
  - name: develop
    protection:
      required_pull_request_reviews: null
      required_status_checks:
        strict: true
        contexts:
          - pre-commit
          - terraform-test
          - docs-build
      enforce_admins: true
      restrictions: null

  # main is the presentation branch that release-cd-refresh-master.yml
  # fast-forwards on release.
  - name: main
    protection:
      required_pull_request_reviews: null
      required_status_checks: null
      enforce_admins: true
      required_linear_history: true
      restrictions: null
