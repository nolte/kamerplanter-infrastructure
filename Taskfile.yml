version: "3"

vars:
  VENV: .venv
  PIP: "{{.VENV}}/bin/pip"

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Create the project-local venv, install the tooling and docs sets, wire the git hooks
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.PIP}} install --upgrade pip"
      - "{{.PIP}} install -r requirements-dev.txt"
      - "{{.PIP}} install -r docs/requirements.txt"
      - "{{.VENV}}/bin/pre-commit install"
      - "touch {{.VENV}}/.install-stamp"
    # Keyed on the manifests, so a Renovate bump is installed locally before
    # `task lint` or `task docs` runs against it, as CI does with a fresh install.
    sources:
      - requirements-dev.txt
      - docs/requirements.txt
      - .pre-commit-config.yaml
    generates:
      - "{{.VENV}}/.install-stamp"

  fmt:
    desc: Format every Terraform file in place
    cmds:
      - terraform fmt -recursive

  lint:
    desc: Run every pre-commit hook over the whole tree (terraform fmt, validate, tflint, yamllint)
    deps: [setup]
    cmds:
      - "{{.VENV}}/bin/pre-commit run --all-files"

  test:
    desc: Run the Terraform module tests in tests/ against a mocked Proxmox provider
    dir: tests
    cmds:
      - terraform init -input=false -backend=false
      - terraform test -test-directory=.

  docs:
    desc: Build the documentation site the same way CI does
    deps: [setup]
    cmds:
      - "{{.VENV}}/bin/mkdocs build --strict"

  docs:serve:
    desc: Serve the documentation site locally with live reload
    deps: [setup]
    cmds:
      - "{{.VENV}}/bin/mkdocs serve -a localhost:8001"

  check:
    desc: The quality gate CI runs on every pull request
    cmds:
      - task: lint
      - task: test
      - task: docs
